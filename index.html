<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Gorod Krovi Solver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header" aria-label="ページヘッダー">
  <div class="app-header-title">Gorod Krovi Solver</div>
  <button class="menu-toggle" id="menuToggleBtn" type="button" aria-label="メニューを開く">☰</button>
</header>

<div class="menu-panel" id="menuPanel" aria-hidden="true">
  <div class="menu-panel-inner">
    <div class="menu-header">
      <span>設定</span>
      <button class="menu-close" id="menuCloseBtn" type="button" aria-label="メニューを閉じる">✕</button>
    </div>

    <div class="menu-rename-trigger">
      <button class="btn btn-room" id="showAreaTitleEditorBtn" type="button">エリア名変更</button>
    </div>

    <div class="menu-title-list hidden" id="areaTitleEditor">
      <div class="menu-title-item">
        <label class="menu-label" for="title_Dept">デパート</label>
        <input id="title_Dept" class="menu-title-input" type="text" maxlength="20" placeholder="デパート" />
      </div>
      <div class="menu-title-item">
        <label class="menu-label" for="title_Drag">ドラゴンコマンド</label>
        <input id="title_Drag" class="menu-title-input" type="text" maxlength="20" placeholder="ドラゴンコマンド" />
      </div>
      <div class="menu-title-item">
        <label class="menu-label" for="title_Armo">武器庫</label>
        <input id="title_Armo" class="menu-title-input" type="text" maxlength="20" placeholder="武器庫" />
      </div>
      <div class="menu-title-item">
        <label class="menu-label" for="title_Supp">補給所</label>
        <input id="title_Supp" class="menu-title-input" type="text" maxlength="20" placeholder="補給所" />
      </div>
      <div class="menu-title-item">
        <label class="menu-label" for="title_Infi">診療所</label>
        <input id="title_Infi" class="menu-title-input" type="text" maxlength="20" placeholder="診療所" />
      </div>
      <div class="menu-title-item">
        <label class="menu-label" for="title_Tank">戦車工場</label>
        <input id="title_Tank" class="menu-title-input" type="text" maxlength="20" placeholder="戦車工場" />
      </div>
    </div>

    <div class="menu-actions hidden" id="areaTitleActions">
      <button class="btn btn-room" id="saveRoomTitleBtn" type="button">保存</button>
      <button class="btn btn-reset" id="resetRoomTitleBtn" type="button">初期値に戻す</button>
    </div>
  </div>
</div>

<div class="share-panel">
  <div class="share-row">
    <label for="roomIdInput">ルームID</label>
    <input id="roomIdInput" type="text" maxlength="20" autocomplete="off" placeholder="例: party-001" />
    <button class="btn btn-room" id="joinRoomBtn" type="button">適用</button>
    <button class="btn btn-copy" id="copyRoomBtn" type="button">URLをコピー</button>
    <button class="btn btn-leave" id="leaveRoomBtn" type="button">退出</button>
  </div>
  <div class="share-status" id="shareStatus">ローカルモード</div>
</div>

<div class="panel-grid">
  <!-- 1. デパート -->
  <div class="room-card" data-room="Dept">
    <div class="room-header">
      <span class="room-title">デパート</span>
      <div class="status-toggle">
        <button type="button" class="st-btn btn-g" data-room="Dept" data-type="green">G</button>
        <button type="button" class="st-btn btn-ng" data-room="Dept" data-type="notgreen">B</button>
        <button type="button" class="st-btn btn-p" data-room="Dept" data-type="password">P</button>
      </div>
    </div>
    <div class="valves-container">
      <div class="btn-group" data-room="Dept">
        <button type="button" class="v-btn active" data-val="1">1</button>
        <button type="button" class="v-btn" data-val="2">2</button>
        <button type="button" class="v-btn" data-val="3">3</button>
      </div>
      <div class="prob-display" id="pr_Dept">1:33 2:33 3:33</div>
    </div>
  </div>

  <!-- 2. ドラゴンコマンド -->
  <div class="room-card" data-room="Drag">
    <div class="room-header">
      <span class="room-title">ドラゴンコマンド</span>
      <div class="status-toggle">
        <button type="button" class="st-btn btn-g" data-room="Drag" data-type="green">G</button>
        <button type="button" class="st-btn btn-ng" data-room="Drag" data-type="notgreen">B</button>
        <button type="button" class="st-btn btn-p" data-room="Drag" data-type="password">P</button>
      </div>
    </div>
    <div class="valves-container">
      <div class="btn-group" data-room="Drag">
        <button type="button" class="v-btn active" data-val="1">1</button>
        <button type="button" class="v-btn" data-val="2">2</button>
        <button type="button" class="v-btn" data-val="3">3</button>
      </div>
      <div class="prob-display" id="pr_Drag">1:33 2:33 3:33</div>
    </div>
  </div>

  <!-- 3. 武器庫 -->
  <div class="room-card" data-room="Armo">
    <div class="room-header">
      <span class="room-title">武器庫</span>
      <div class="status-toggle">
        <button type="button" class="st-btn btn-g" data-room="Armo" data-type="green">G</button>
        <button type="button" class="st-btn btn-ng" data-room="Armo" data-type="notgreen">B</button>
        <button type="button" class="st-btn btn-p" data-room="Armo" data-type="password">P</button>
      </div>
    </div>
    <div class="valves-container">
      <div class="btn-group" data-room="Armo">
        <button type="button" class="v-btn active" data-val="1">1</button>
        <button type="button" class="v-btn" data-val="2">2</button>
        <button type="button" class="v-btn" data-val="3">3</button>
      </div>
      <div class="prob-display" id="pr_Armo">1:33 2:33 3:33</div>
    </div>
  </div>

  <!-- 4. 補給所 -->
  <div class="room-card" data-room="Supp">
    <div class="room-header">
      <span class="room-title">補給所</span>
      <div class="status-toggle">
        <button type="button" class="st-btn btn-g" data-room="Supp" data-type="green">G</button>
        <button type="button" class="st-btn btn-ng" data-room="Supp" data-type="notgreen">B</button>
        <button type="button" class="st-btn btn-p" data-room="Supp" data-type="password">P</button>
      </div>
    </div>
    <div class="valves-container">
      <div class="btn-group" data-room="Supp">
        <button type="button" class="v-btn active" data-val="1">1</button>
        <button type="button" class="v-btn" data-val="2">2</button>
        <button type="button" class="v-btn" data-val="3">3</button>
      </div>
      <div class="prob-display" id="pr_Supp">1:33 2:33 3:33</div>
    </div>
  </div>

  <!-- 5. 診療所 -->
  <div class="room-card" data-room="Infi">
    <div class="room-header">
      <span class="room-title">診療所</span>
      <div class="status-toggle">
        <button type="button" class="st-btn btn-g" data-room="Infi" data-type="green">G</button>
        <button type="button" class="st-btn btn-ng" data-room="Infi" data-type="notgreen">B</button>
        <button type="button" class="st-btn btn-p" data-room="Infi" data-type="password">P</button>
      </div>
    </div>
    <div class="valves-container">
      <div class="btn-group" data-room="Infi">
        <button type="button" class="v-btn active" data-val="1">1</button>
        <button type="button" class="v-btn" data-val="2">2</button>
        <button type="button" class="v-btn" data-val="3">3</button>
      </div>
      <div class="prob-display" id="pr_Infi">1:33 2:33 3:33</div>
    </div>
  </div>

  <!-- 6. 戦車工場 -->
  <div class="room-card" data-room="Tank">
    <div class="room-header">
      <span class="room-title">戦車工場</span>
      <div class="status-toggle">
        <button type="button" class="st-btn btn-g" data-room="Tank" data-type="green">G</button>
        <button type="button" class="st-btn btn-ng" data-room="Tank" data-type="notgreen">B</button>
        <button type="button" class="st-btn btn-p" data-room="Tank" data-type="password">P</button>
      </div>
    </div>
    <div class="valves-container">
      <div class="btn-group" data-room="Tank">
        <button type="button" class="v-btn active" data-val="1">1</button>
        <button type="button" class="v-btn" data-val="2">2</button>
        <button type="button" class="v-btn" data-val="3">3</button>
      </div>
      <div class="prob-display" id="pr_Tank">1:33 2:33 3:33</div>
    </div>
  </div>
</div>

<div class="control-actions">
  <button class="btn btn-reset" id="resetBtn">リセット</button>
</div>

<div class="results-panel" id="resPanel">
  <div class="table-scroll-wrapper">
    <table>
      <thead>
        <tr>
          <th id="resultsHeader_Dept">デパ</th>
          <th id="resultsHeader_Drag">ドラ</th>
          <th id="resultsHeader_Armo">武器</th>
          <th id="resultsHeader_Supp">補給</th>
          <th id="resultsHeader_Infi">診療</th>
          <th id="resultsHeader_Tank">戦車</th>
        </tr>
      </thead>
      <tbody id="resBody"></tbody>
    </table>
  </div>
</div>

</body>
</html>
